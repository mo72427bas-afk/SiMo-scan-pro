name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q simo_scan_pro.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.x"
      - name: Bootstrap
        working-directory: simo_scan_pro
        run: bash tool/bootstrap.sh
      - name: Gradle opt-out
        working-directory: simo_scan_pro
        run: |
          printf '\nandroid.newDsl=false\nandroid.builtInKotlin=false\n' >> android/gradle.properties
          cat android/gradle.properties
      - name: Analyze
        working-directory: simo_scan_pro
        run: flutter analyze || true
      - name: Build
        working-directory: simo_scan_pro
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: simo_scan_pro/build/app/outputs/flutter-apk/app-release.apk
